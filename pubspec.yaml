name: apertix
description: "Spectrum — A fast, modern cross-platform photo viewer and editor."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # Image decoding & display
  image: ^4.3.0
  extended_image: ^9.0.1
  flutter_svg: ^2.0.10+1
  photo_view: ^0.15.0

  # File system
  file_picker: ^8.0.7
  path: ^1.9.0

  # UI utilities
  window_manager: ^0.3.9
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  flutter_animate: ^4.3.0

  # Tools
  exif: ^3.2.0
  shared_preferences: ^2.3.3
  flutter_colorpicker: ^1.1.0

  # Networking (Social Hub - Phase 6)
  dio: ^5.7.0
  flutter_appauth: ^7.0.1
  flutter_secure_storage: ^9.2.2

  # Android sharing
  share_plus: ^12.0.2

  # Utilities
  url_launcher: ^6.3.1
  intl: ^0.20.0
  crypto: ^3.0.5
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.18.0

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

msix_config:
  display_name: Spectrum
  publisher_display_name: RockstarRajeev
  identity_name: com.rockstarrajeev.spectrum
  msix_version: 0.1.0.0
  logo_path: assets/icons/app_icon.png
  capabilities: internetClient, photosLibrary
  architecture: x64
  executable_name: spectrum.exe
